<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Moldability Checker</title>
  <link rel="stylesheet" href="style.css">
  <!-- STEP reader (OpenCascade compiled to WebAssembly) -->
  <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js"
    }
  }
  </script>
</head>
<body>
  <aside id="panel">
    <h1>Moldability Checker</h1>
    <p class="hint">Your file is processed in this browser and never uploaded.</p>

    <label>STEP file (.stp / .step)
      <input type="file" id="file" accept=".stp,.step">
    </label>
    <label>Material (optional)
      <select id="material"></select>
    </label>
    <label>Texture depth, mm (optional)
      <input type="number" id="texture" min="0" step="0.005" placeholder="0 = polished">
    </label>
    <label for="pull">Pull direction</label>
    <div class="row">
      <select id="pull">
        <option value="auto">Auto</option>
        <option value="x">X</option><option value="y">Y</option><option value="z">Z</option>
      </select>
      <button id="flip" type="button" disabled
              title="Swap which side is the core (moving half) and which is the cavity (fixed half)">⇅ Flip</button>
    </div>
    <button id="run" disabled>Analyze</button>

    <div id="status"></div>
    <div id="results"></div>
  </aside>
  <main id="viewer"></main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
